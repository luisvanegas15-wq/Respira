<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Respira · Plan para salir de deudas</title>
<meta name="description" content="Tu plan para salir de deudas, a tu ritmo.">
<meta name="theme-color" content="#1E1F3B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Respira">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
/* Layout: barra lateral nocturna fija (escritorio) / barra inferior (celular); módulos como pantallas, el anillo que respira es la firma */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1E1F3B; --muted:#676986; --line:#E3E4EF;
  --night:#1E1F3B; --night-2:#2A2B4D; --night-ink:#F1F0FF; --night-muted:#A9A8CC;
  --mint:#1F9E86; --coral:#E95A49; --sun:#E9A820; --lav:#7B6CF0;
  --mint-s:#DDF4EE; --coral-s:#FCE3DF; --sun-s:#FFF1CC; --lav-s:#ECE9FF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121321; --surface:#1A1B2D; --ink:#ECEBFA; --muted:#A3A3C4; --line:#2B2C45;
  --night:#0C0D18; --night-2:#1B1C30; --night-ink:#F1F0FF; --night-muted:#9C9BC0;
  --mint:#3CC7AB; --coral:#FF7A69; --sun:#F7C04A; --lav:#9D90FF;
  --mint-s:#16352F; --coral-s:#3A1F22; --sun-s:#3A3018; --lav-s:#26224A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121321; --surface:#1A1B2D; --ink:#ECEBFA; --muted:#A3A3C4; --line:#2B2C45;
  --night:#0C0D18; --night-2:#1B1C30; --night-ink:#F1F0FF; --night-muted:#9C9BC0;
  --mint:#3CC7AB; --coral:#FF7A69; --sun:#F7C04A; --lav:#9D90FF;
  --mint-s:#16352F; --coral-s:#3A1F22; --sun-s:#3A3018; --lav-s:#26224A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- Login ---------- */
.login{min-height:100%;background:var(--night);color:var(--night-ink);display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;left:50%;top:-180px;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--mint) 38%,transparent),transparent 65%);animation:respirar 8s ease-in-out infinite;pointer-events:none}
.login-box{position:relative;width:min(560px,100%);display:grid;gap:26px;text-align:center}
.marca{font-family:var(--display);font-weight:800;font-size:clamp(48px,11vw,84px);line-height:.9;letter-spacing:-.04em}
.marca span{color:var(--sun)}
.login p.lema{color:var(--night-muted);margin:6px 0 0;font-size:16px}
.perfiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.perfil{background:var(--night-2);border:1px solid transparent;border-radius:20px;padding:16px 14px 12px;width:142px;display:grid;justify-items:center;gap:8px;color:var(--night-ink);transition:transform .2s,border-color .2s}
.perfil:hover{transform:translateY(-3px);border-color:var(--sun)}
.perfil b{font-size:15px}
.perfil small{color:var(--night-muted);font-size:12px;line-height:1.3}
.perfil.nuevo{border:1.5px dashed var(--night-muted);background:transparent}
.plus{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:var(--sun);border:2px solid var(--night-2)}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--night-muted)}
.pin-dots i.on{background:var(--sun);border-color:var(--sun)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:62px;border-radius:50%;border:0;background:var(--night-2);color:var(--night-ink);font-size:22px;font-weight:600;font-family:var(--display)}
.pad button:active{background:var(--lav)}
.pad .ghost{background:transparent;font-size:14px;font-family:var(--body)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.login .msg{min-height:22px;color:var(--coral);font-size:14px}
.linkbtn{background:none;border:0;color:var(--night-muted);text-decoration:underline;font-size:14px}
.login-form{background:var(--night-2);border-radius:22px;padding:22px;text-align:left;display:grid;gap:14px}
.login-form label{font-size:13px;color:var(--night-muted);display:grid;gap:6px}
.login-form input,.login-form select{background:var(--night);border:1px solid #3a3b60;border-radius:12px;padding:11px 12px;color:var(--night-ink)}
.avatares{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatares button{border:2px solid transparent;border-radius:50%;padding:0;background:none;aspect-ratio:1;max-width:100%}
.avatares button.sel{border-color:var(--sun);transform:scale(1.06)}
.check{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px!important;color:var(--night-ink)!important}

/* ---------- App ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--night);color:var(--night-ink);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;padding:4px 12px 16px;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mint);animation:respirar 8s ease-in-out infinite}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--night-muted);font-weight:600;text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:var(--night-ink);background:var(--night-2)}
.nav.act{background:var(--night-2);color:var(--night-ink)}
.nav.act svg{color:var(--sun)}
.yo{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--night-2)}
.yo div{min-width:0}
.yo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yo small{color:var(--night-muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*,.grid>*,.dos>*,.papel .cuerpo>*{min-width:0}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.cab h1{font-size:clamp(26px,4vw,36px)}
.cab p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel h2{font-size:19px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.menta{background:var(--mint);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.peq{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.campo{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.campo input,.campo select,.campo textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:500;color:var(--ink);width:100%}
.campo textarea{resize:vertical;min-height:80px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.chip.ok{background:var(--mint-s);color:var(--mint)}
.chip.mal{background:var(--coral-s);color:var(--coral)}
.chip.sun{background:var(--sun-s);color:color-mix(in srgb,var(--sun) 70%,var(--ink))}
.chip.lav{background:var(--lav-s);color:var(--lav)}
.vacio{text-align:center;color:var(--muted);padding:28px 10px}

/* Héroe de inicio */
.hero{background:var(--night);color:var(--night-ink);border-radius:26px;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lav) 40%,transparent),transparent 65%);pointer-events:none}
.hero .hola{display:flex;align-items:center;gap:16px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.02}
.hero .frase{color:var(--night-muted);font-size:16px;margin:12px 0 18px;max-width:46ch}
.hero .btn{background:var(--sun);color:#1E1F3B}
.hero .btn.sec{background:transparent;color:var(--night-ink);border-color:#43446d}
.anillo{position:relative;width:200px;height:200px;animation:respirar 8s ease-in-out infinite;z-index:1}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo .centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.anillo .centro b{font-family:var(--display);font-size:46px;line-height:1;color:var(--sun)}
.anillo .centro small{color:var(--night-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.login::before{animation-name:respirar2}
@keyframes respirar2{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}}
.dato{display:grid;gap:4px}
.dato .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.dato .s{font-size:13px;color:var(--muted)}
.tile{border-top:4px solid var(--c,var(--ink))}
.tile .v{color:var(--c,var(--ink))}
.ataca{background:var(--sun-s);border-color:transparent}
.lista{display:grid;gap:2px}
.it{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .grow small{color:var(--muted)}
.dia{width:46px;height:46px;border-radius:12px;background:var(--lav-s);color:var(--lav);display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:700;line-height:1;flex:none}
.dia small{font-size:10px;font-family:var(--body);font-weight:700;color:inherit}
.porque{background:var(--lav-s);border-color:transparent;font-size:17px;font-style:italic}
.porque textarea{width:100%;background:transparent;border:0;font:inherit;font-size:17px;font-style:italic;color:var(--ink);resize:none;min-height:70px}

/* Deudas */
.deuda{display:grid;gap:12px}
.deuda .top{display:flex;align-items:flex-start;gap:12px}
.orden{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.deuda.primero{border:2px solid var(--sun)}
.deuda.primero .orden{background:var(--sun);color:#1E1F3B}
.deuda.saldada{opacity:.75}
.deuda.saldada .orden{background:var(--mint);color:#fff}
.barra{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--mint);border-radius:999px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;font-size:13px;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-size:15px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Barras de mes */
.apilada{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--line)}
.apilada i{display:block;height:100%}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.leyenda span{display:inline-flex;gap:6px;align-items:center}
.leyenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.filas-ed{display:grid;gap:8px}
.filas-ed .fe{display:grid;grid-template-columns:minmax(0,1fr) 140px 34px;gap:8px}
.filas-ed input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.x{border:0;background:none;color:var(--muted);font-size:20px;border-radius:8px}
.x:hover{color:var(--coral);background:var(--coral-s)}

/* Emociones */
.emos{display:flex;flex-wrap:wrap;gap:8px}
.emos button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600}
.emos button.on{background:var(--lav);border-color:var(--lav);color:#fff}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}

/* Hábitos */
.semana{overflow-x:auto}
.semana table{border-collapse:collapse;width:100%;min-width:560px}
.semana th,.semana td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.semana th:first-child,.semana td:first-child{text-align:left}
.semana td input{background:transparent;border:0;font-weight:600;width:100%;min-width:180px}
.tick{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:none;display:inline-grid;place-items:center;color:#fff;font-weight:900}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick.hoy{border-color:var(--lav)}

/* Logros */
.medallas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:14px}
.medalla{text-align:center;display:grid;justify-items:center;gap:6px;padding:18px 12px}
.medalla svg{width:70px;height:70px}
.medalla.off{opacity:.45;filter:grayscale(1)}
.medalla b{font-family:var(--display);font-size:16px}
.medalla small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* Estado de cuenta */
.papel{background:#fff;color:#1E1F3B;border-radius:6px;box-shadow:0 10px 40px rgba(20,20,50,.12);overflow:hidden;border:1px solid var(--line)}
.papel .enc{background:#1E1F3B;color:#fff;padding:22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.papel .enc h3{font-size:24px}
.papel .enc small{color:#B9B8DA}
.papel .cuerpo{padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.papel .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.papel .res div{background:#F4F5FA;border-radius:10px;padding:10px 12px}
.papel .res small{display:block;color:#676986;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.papel .res b{font-family:var(--display);font-size:19px}
.tabla{overflow-x:auto}
.tabla table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.tabla th{background:#ECE9FF;color:#1E1F3B;text-align:left;padding:8px;font-size:12px}
.tabla td{padding:8px;border-bottom:1px solid #E3E4EF}
.tabla td.r,.tabla th.r{text-align:right}
.papel .pie{font-size:11.5px;color:#676986}

/* Modal y avisos */
.velo{position:fixed;inset:0;background:rgba(12,13,24,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.resp{background:var(--night);color:var(--night-ink);text-align:center;justify-items:center}
.resp .bola{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--mint),color-mix(in srgb,var(--mint) 40%,var(--night)));transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out;margin:18px auto}
.resp p{color:var(--night-muted)}

/* Calculadoras */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.resultado{background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:24px;display:grid;gap:16px;min-width:0}
.resultado .eyebrow{color:var(--sun)}
.resultado p{margin:0;color:var(--night-muted)}
.resultado p b{color:var(--night-ink)}
.resultado .barra{background:#33345a}
.resultado .hbar{grid-template-columns:96px minmax(0,1fr) auto}
.gran{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,50px);line-height:1;color:var(--mint);letter-spacing:-.02em}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.cifras div{background:var(--night-2);border-radius:12px;padding:12px 14px;min-width:0}
.cifras small{display:block;color:var(--night-muted);font-size:12px}
.cifras b{font-family:var(--display);font-size:19px;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600}
.pills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

const monPago = p => p.mon || monDeuda(p.deuda);
function pagadoDe(id, m) { return D.pagos.filter(p => p.deuda === id && (!m || monPago(p) === m)).reduce((s, p) => s + p.valor, 0); }
const dos = (x, k) => x.bi ? `${fmtM(x['n' + k], x.mon)} + ${fmtM(x['n' + k + '2'], 'USD')}` : fmtM(x['n' + k], x.mon);
function deudasCalc() {
  return D.deudas.map(x => {
    const m = monD(x), bi = !!x.bimoneda, k = conv(1, m, moneda), k2 = conv(1, 'USD', moneda);
    const pag = pagadoDe(x.id, m), hoy = Math.max(0, x.saldo - pag);
    const s2 = bi ? x.saldoUSD || 0 : 0, pag2 = bi ? pagadoDe(x.id, 'USD') : 0, hoy2 = Math.max(0, s2 - pag2), min2 = bi ? x.minimoUSD || 0 : 0;
    const saldo = x.saldo * k + s2 * k2, hoyB = hoy * k + hoy2 * k2;
    return { ...x, mon: m, bi, nSaldo: x.saldo, nPag: pag, nHoy: hoy, nMin: x.minimo, nSaldo2: s2, nPag2: pag2, nHoy2: hoy2, nMin2: min2,
      saldo, pagado: pag * k + pag2 * k2, hoy: hoyB, minimo: x.minimo * k + min2 * k2, avance: saldo ? Math.min(1, (saldo - hoyB) / saldo) : 0,
      manejoB: (x.manejo || 0) * k, uso: x.cupo ? hoyB / (x.cupo * k) : null }; });
}
function ordenar(lista, metodo = D.metodo) {
  const act = lista.filter(x => x.hoy > 0);
  act.sort(metodo === 'avalancha' ? (a, b) => b.tasa - a.tasa || a.hoy - b.hoy : (a, b) => a.hoy - b.hoy || b.tasa - a.tasa);
  return act;
}
function simular(lista, extra, metodo = D.metodo, plus = null, traza = false) {
  let ds = ordenar(lista, metodo).map(x => ({ id: x.id, n: x.nombre, s: x.hoy, t: x.tasa / 100, m: x.minimo, f: x.manejoB || 0 }));
  if (!ds.length) return { meses: 0, interes: 0, fin: {}, filas: [] };
  const presupuesto = ds.reduce((s, x) => s + x.m, 0) + extra;
  let mes = 0, interes = 0; const fin = {}, filas = [];
  while (ds.some(x => x.s > 0.5) && mes < 600) {
    mes++; let im = 0; const pg = {};
    ds.forEach(x => { if (x.s > 0.5) { const i = x.s * x.t + x.f; im += i; x.s += i; } });
    interes += im;
    let caja = presupuesto + (plus ? plus(mes) : 0);
    const pagar = (x, v) => { if (v <= 0) return; x.s -= v; caja -= v; pg[x.id] = (pg[x.id] || 0) + v; };
    ds.forEach(x => { if (x.s > 0.5) pagar(x, Math.min(x.m, x.s, caja)); });
    const orden = ds.filter(x => x.s > 0.5);
    if (metodo === 'avalancha') orden.sort((a, b) => b.t - a.t || a.s - b.s); else orden.sort((a, b) => a.s - b.s);
    for (const x of orden) { if (caja <= 0.5) break; pagar(x, Math.min(caja, x.s)); }
    const sald = [];
    ds.forEach(x => { if (x.s <= 0.5 && !fin[x.id]) { x.s = 0; fin[x.id] = mes; sald.push(x.n); } });
    if (traza) filas.push({ mes, pago: Object.values(pg).reduce((a, b) => a + b, 0), interes: im, saldo: ds.reduce((t, x) => t + Math.max(0, x.s), 0), pg, sald });
  }
  return mes >= 600 ? null : { meses: mes, interes, fin, filas };
}
const CUANDO = { dic: ['Prima de diciembre', 11], jun: ['Prima de junio', 5], feb: ['Cesantías (febrero)', 1], ya: ['Este mes', -1] };
function mesDe(c) { const t = CUANDO[c][1]; if (t < 0) return 1; const k = (t - new Date().getMonth() + 12) % 12; return k || 12; }
function simPlus(lista) {
  const S = D.sim || {}, monto = S.monto || 0; if (!monto) return null;
  const k = mesDe(S.cuando || 'dic'), anual = !!S.anual;
  const plus = m => (m === k || (anual && m > k && (m - k) % 12 === 0)) ? monto : 0;

function resumen() {
  const ds = deudasCalc();
  const total0 = ds.reduce((s, x) => s + x.saldo, 0), hoy = ds.reduce((s, x) => s + x.hoy, 0), pagado = ds.reduce((s, x) => s + Math.min(x.pagado, x.saldo), 0);
  const ingresos = D.mes.ingresos.reduce((s, x) => s + x.v, 0), gastos = D.mes.gastos.reduce((s, x) => s + x.v, 0);
  const minimos = ds.filter(x => x.hoy > 0).reduce((s, x) => s + Math.min(x.minimo, x.hoy), 0);
  const libre = ingresos - gastos - minimos;
  const orden = ordenar(ds);
  const sim = simular(ds, D.mes.extra || 0);
  const interesMes = orden.reduce((s, x) => s + x.hoy * x.tasa / 100, 0);
  return { ds, orden, total0, hoy, pagado, avance: total0 ? pagado / total0 : 0, ingresos, gastos, minimos, libre, sim, interesMes, atrasadas: ds.filter(x => x.hoy > 0 && x.estado === 'Atrasada').length };
}

function cambiarMoneda(n) {
  const v = moneda; if (n === v || !MONEDAS[n]) return;
  const c = x => red2(conv(x, v, n));
  D.deudas.forEach(x => { if (!x.moneda) x.moneda = v; });
  D.mes.ingresos.forEach(x => { x.v = c(x.v); }); D.mes.gastos.forEach(x => { x.v = c(x.v); }); D.mes.extra = c(D.mes.extra || 0);
  D.emociones.forEach(e => { e.monto = c(e.monto); });
  if (D.sim) D.sim.monto = c(D.sim.monto || 0);
  D.moneda = moneda = n; guardar(); cerrarModal(); pintarApp(); aviso('Ahora ves tus totales en ' + MONEDAS[n].n.toLowerCase());
}

function datosEstado() {
  const ds = deudasCalc().filter(x => est.deuda === 'todas' || x.id === est.deuda);
  const partes = ds.flatMap(x => x.bi ? [{ x, mon: x.mon, saldo: x.nSaldo, nombre: x.nombre + ' (pesos)' }, { x, mon: 'USD', saldo: x.nSaldo2, nombre: x.nombre + ' (dólares)' }] : [{ x, mon: x.mon, saldo: x.nSaldo, nombre: x.nombre }]);
  const filas = partes.map(({ x, mon, saldo, nombre }) => {
    const mio = p => p.deuda === x.id && monPago(p) === mon;
    const antes = D.pagos.filter(p => mio(p) && p.fecha < est.desde).reduce((s, p) => s + p.valor, 0);
    const en = D.pagos.filter(p => mio(p) && p.fecha >= est.desde && p.fecha <= est.hasta);
    const pagosP = en.reduce((s, p) => s + p.valor, 0);
    const ini = Math.max(0, saldo - antes), fin = Math.max(0, ini - pagosP), k = conv(1, mon, moneda), interes = fin * x.tasa / 100;
    return { x, mon, nombre, ini, pagosP, fin, interes, avance: saldo ? Math.min(1, (saldo - fin) / saldo) : 0, pagos: en, b: { ini: ini * k, pagosP: pagosP * k, fin: fin * k, interes: interes * k } };
  });
  const tot = k => filas.reduce((s, f) => s + f.b[k], 0);
  const pagos = filas.flatMap(f => f.pagos.map(p => ({ ...p, nombre: f.x.nombre, mon: f.mon }))).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const otras = [...new Set(filas.map(f => f.mon).concat(moneda))].filter(m => m !== 'COP');
  const nota = filas.some(f => f.mon !== moneda) ? `Totales en ${MONEDAS[moneda].n.toLowerCase()} con ${otras.map(m => `1 ${m} = ${fmtM(tasaDe(m), 'COP')}`).join(' y ')} (tasa del ${fechaLarga(tasasD().fecha)}).` : '';
  return { filas, pagos, ini: tot('ini'), pagosP: tot('pagosP'), fin: tot('fin'), interes: tot('interes'), nota };
}

  const fases = [['Inhala', 4, 1], ['Sostén', 4, 1], ['Exhala', 6, .6]];

    const b = $('#bola'); if (!b) return;

    const [n, s, esc2] = fases[i];

const cargados = {};
function cargarLib(src) { return cargados[src] || (cargados[src] = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete cargados[src]; mal(new Error('No se pudo cargar')); }; document.head.appendChild(s); })); }
async function guardarArchivo(nombre, blob) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename: nombre, data: blob }); aviso('Archivo listo: ' + nombre); return; }
    catch (e) {
      if (e && (e.code === 'dismissed' || e.code === 'not_granted')) { aviso('Descarga cancelada'); return; }
      try { await dl.save({ filename: nombre, data: new Uint8Array(await blob.arrayBuffer()) }); aviso('Archivo listo: ' + nombre); return; } catch (e2) {}
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); aviso('Descargando ' + nombre);
}
const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase();

async function descargarPDF() {
  try { await cargarLib('vendor/jspdf.umd.min.js'); }

        confirmar('¿Restaurar esta copia?', `Copia del ${esc(j.fecha)}. Reemplaza los datos actuales de este perfil.`, () => { D = j.datos; moneda = MONEDAS[D.moneda] ? D.moneda : 'COP'; if (!D.habitos) D.habitos = { nombres: HABITOS.slice(), semanas: {} }; guardar(); vista = 'inicio'; pintarApp(); aviso('Copia restaurada'); }, 'Sí, restaurar');
      } catch (e) { aviso('Ese archivo no es una copia de Respira'); }
    };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.type === 'date') { const l = document.querySelector(`[data-fecha="${t.id}"]`); if (l) l.textContent = fFecha(t.value); }
  if (t.id === 'porque') { D.porque = t.value; guardar(); }
  if (t.id === 'cv-monto' || t.id === 'cv-ofrecen') { D.conv[t.id === 'cv-monto' ? 'monto' : 'ofrecen'] = t.value; guardar(); const r = $('#cv-res'); if (r) r.innerHTML = resConversor(); return; }
  if (t.id === 'ea') { const ea = decimal(t.value) / 100; $('#mv').textContent = ea > 0 ? ((Math.pow(1 + ea, 1 / 12) - 1) * 100).toFixed(2).replace('.', ',') + '%' : '—'; }
});
const fMon = () => { const v = $('#f-moneda').value; return v === 'BI' ? 'COP' : v; };
const MF = { 'p-valor': () => $('#p-moneda').value, 'f-saldo': fMon, 'f-min': fMon, 'f-saldo2': () => 'USD', 'f-min2': () => 'USD', 'f-cupo': fMon, 'f-manejo': fMon, 'e-monto': () => moneda, 'sim-monto': () => moneda };
document.addEventListener('focusout', ev => { const t = ev.target; if (MF[t.id] && t.value) { const m = MF[t.id](); t.value = fmtM(dineroM(t.value, m), m); } });
document.addEventListener('keydown', ev => {
  if (!yo && loginModo === 'pin') { if (/^\d$/.test(ev.key)) teclaPin(ev.key); else if (ev.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); vistaLogin(); } }
  if (ev.key === 'Escape') cerrarModal();
});

/* ================= Arranque ================= */
(async function () {
  aplicarTema();
  perfiles = LS.get('respira:perfiles', null);
  if (!perfiles) {
    const demo = { id: 'demo-ana', nombre: 'Ana', correo: 'ana@ejemplo.com', avatar: 4, demo: true, creado: hoyISO() };
    demo.pin = await hashPin(demo.id, '1234');
    perfiles = [demo]; guardarPerfiles(); LS.set('respira:datos:' + demo.id, datosEjemplo());
  }
  const s = SS.get('respira:sesion'), p = s && perfiles.find(x => x.id === s);
  if (p) entrar(p); else vistaLogin();
})();
</script>
